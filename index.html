<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#17352c"><title>Читач — українська бібліотека</title>
<style>
:root{color-scheme:light;--bg:#f6f3eb;--ink:#172c25;--muted:#66736b;--line:#d9dfd7;--accent:#1b5946;--card:#fff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,sans-serif}header{background:var(--ink);color:#fff;padding:30px 18px 28px}header .wrap,main{max-width:960px;margin:auto}h1{font-size:clamp(32px,7vw,52px);line-height:1.05;margin:0 0 10px;letter-spacing:-1.5px}header p{color:#d2e0d8;margin:0}.wrap{padding-left:18px;padding-right:18px}main{padding-top:22px;padding-bottom:60px}.search{display:flex;gap:8px;flex-wrap:wrap}.search input{flex:1;min-width:180px;padding:14px;border:1px solid var(--line);border-radius:12px;font:inherit;background:#fff}.search button,.btn{padding:12px 16px;border:0;border-radius:10px;background:var(--accent);color:#fff;font:inherit;cursor:pointer}.filters{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 22px}.filters select{padding:10px;border:1px solid var(--line);border-radius:10px;background:#fff;font:inherit}.status{color:var(--muted);font-size:14px;margin:12px 0}.books{display:grid;grid-template-columns:repeat(auto-fit,minmax(235px,1fr));gap:12px}.book{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;min-height:190px}.book h2{font-size:19px;line-height:1.25;margin:0 0 6px}.author{color:var(--muted);margin-bottom:10px}.tags{font-size:12px;color:var(--muted);margin-bottom:14px}.actions{display:flex;gap:8px;margin-top:auto}.actions button,.actions a{font:inherit;font-size:14px;text-decoration:none;border-radius:8px;padding:9px 11px;cursor:pointer}.preview{background:#e8eee8;color:var(--ink);border:1px solid var(--line)}.download{background:var(--accent);color:white;border:0}.empty{padding:24px;border:1px dashed var(--line);border-radius:12px;color:var(--muted)}dialog{width:min(92vw,760px);max-height:85vh;border:1px solid var(--line);border-radius:14px;padding:20px;color:var(--ink)}dialog::backdrop{background:#0b1712aa}dialog h2{margin-top:0}#previewText{white-space:pre-wrap;overflow-wrap:anywhere;max-height:58vh;overflow:auto;font:16px/1.7 Georgia,serif}.close{float:right;background:#e8eee8;color:var(--ink);border:0;border-radius:8px;padding:8px 12px}footer{border-top:1px solid var(--line);padding:20px;color:var(--muted);font-size:13px}a{color:inherit}
</style></head><body>
<header><div class="wrap"><h1>Читач<span style="color:#a9d3b9">.</span></h1><p>Українські книжки — шукай, переглядай, читай.</p></div></header>
<main class="wrap"><div class="search"><input id="q" type="search" placeholder="Назва книжки, автор або жанр…" aria-label="Пошук книжок"><button id="searchBtn">Шукати</button></div>
<div class="filters"><select id="category"><option value="">Усі жанри</option></select><select id="sort"><option value="title">За назвою</option><option value="author">За автором</option></select></div>
<p id="status" class="status">Завантажуємо каталог…</p><div id="books" class="books"></div>
</main><footer><div class="wrap">Книжки публікуються лише за наявності відповідних прав або дозволу. Автоматично знайдені твори потребують перевірки статусу авторського права.</div></footer>
<dialog id="preview"><button class="close" id="closePreview">Закрити ✕</button><h2 id="previewTitle">Передперегляд</h2><div id="previewText">Завантаження…</div><p><a id="previewDownload" class="btn" download>Завантажити TXT</a></p></dialog>
<script>
const CATALOG_URL='./catalog.json';let allBooks=[];const $=s=>document.querySelector(s);
function norm(s=''){return String(s).toLocaleLowerCase('uk-UA').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[’ʼ`]/g,"'").replace(/[^a-zа-яіїєґ0-9\s'-]/gi,' ').replace(/\s+/g,' ').trim()}
function fileUrl(book){return new URL(book.file,location.href).href}
function escapeHtml(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(){const q=norm($('#q').value),cat=$('#category').value,sort=$('#sort').value;let list=allBooks.filter(b=>{const hay=norm([b.title,b.author,...(b.categories||[]),...(b.sourceCategories||[])].join(' '));return (!q||q.split(' ').every(w=>hay.includes(w)))&&(!cat||(b.categories||[]).includes(cat))});list.sort((a,b)=>String(a[sort]||'').localeCompare(String(b[sort]||''),'uk'));$('#status').textContent=`Знайдено книжок: ${list.length} · У каталозі: ${allBooks.length}`;$('#books').innerHTML=list.length?list.map((b,i)=>`<article class="book"><h2>${escapeHtml(b.title||'Без назви')}</h2><div class="author">${escapeHtml(b.author||'Автор не вказаний')}</div><div class="tags">${escapeHtml((b.categories||[]).join(' · ')||'Жанр не визначено')}${b.licenseStatus==='needs_review'?' · потребує перевірки прав':''}</div><div class="actions"><button class="preview" data-preview="${i}">Передперегляд</button><a class="download" href="${escapeHtml(fileUrl(b))}" download>Завантажити</a></div></article>`).join(''):'<div class="empty">Поки що книжок не знайдено. Спробуй інший запит або запусти оновлення каталогу у вкладці Actions на GitHub.</div>';$('#books').querySelectorAll('[data-preview]').forEach(btn=>btn.addEventListener('click',()=>showPreview(list[+btn.dataset.preview])))}
async function showPreview(book){$('#previewTitle').textContent=book.title||'Передперегляд';$('#previewText').textContent='Завантаження тексту…';$('#previewDownload').href=fileUrl(book);$('#previewDownload').download=(book.title||'knyzhka').replace(/[\\/:*?"<>|]/g,'_')+'.txt';$('#preview').showModal();try{const r=await fetch(fileUrl(book));if(!r.ok)throw Error('missing');$('#previewText').textContent=(await r.text()).slice(0,50000)||'Текст порожній.'}catch(e){$('#previewText').textContent='Не вдалося завантажити файл. Перевір, чи файл існує в репозиторії та чи шлях у catalog.json правильний.'}}
async function init(){try{const r=await fetch(CATALOG_URL+'?v='+Date.now());if(!r.ok)throw Error('catalog');const data=await r.json();allBooks=data.books||[];const cats=[...new Set(allBooks.flatMap(b=>b.categories||[]))].sort((a,b)=>a.localeCompare(b,'uk'));$('#category').innerHTML='<option value="">Усі жанри</option>'+cats.map(c=>`<option>${escapeHtml(c)}</option>`).join('');render()}catch(e){$('#status').textContent='Не вдалося прочитати catalog.json. Перевір, що репозиторій опубліковано через GitHub Pages.';$('#books').innerHTML='<div class="empty">Каталог ще не доступний. Після налаштування GitHub Pages та запуску workflow він з’явиться тут.</div>'}}
$('#q').addEventListener('input',render);$('#searchBtn').addEventListener('click',render);$('#category').addEventListener('change',render);$('#sort').addEventListener('change',render);$('#closePreview').addEventListener('click',()=>$('#preview').close());init();
</script></body></html>
